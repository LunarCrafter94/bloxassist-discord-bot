[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloxfruits-helper-credit-bot"
version = "0.8.0"
description = "A multi-server Blox Fruits ticket, credit, audit, and invite bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord.py>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pyzipper>=0.3.6,<1",
]

[tool.setuptools.packages.find]
where = ["source-files"]
include = ["bloxfruits_helper_credit_bot*"]
