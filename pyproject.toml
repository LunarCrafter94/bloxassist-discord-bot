[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bloxassist-discord-bot"
version = "0.10.0"
description = "BloxAssist, a multi-server Discord bot for service tickets, credit management, audit, and invite coordination."
readme = "README.md"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
dependencies = [
    "discord.py>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pyzipper>=0.3.6,<1",
]

[tool.setuptools.packages.find]
where = ["source-files"]
include = ["bloxassist_discord_bot*"]
